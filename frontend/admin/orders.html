<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Đơn hàng - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="admin-styles.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#06B6D4', sidebar: '#1e293b' } } }
        }
    </script>
</head>
<body class="bg-gray-100">
    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 text-white h-screen flex flex-col fixed left-0 top-0 overflow-y-auto">
            <div class="p-6">
                <div class="flex items-center space-x-3 mb-8">
                    <img src="http://localhost:3001/images/logo.png?v=2" alt="Logo" class="h-10 w-10 rounded-full">
                    <div>
                        <h2 class="text-xl font-bold">Orianna Admin</h2>
                        <p class="text-gray-400 text-sm">Quản trị viên</p>
                    </div>
                </div>
            </div>
            
            <nav class="px-4 pb-4 flex-1 flex flex-col justify-between">
            <div class="space-y-1">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                    <span class="text-xl">📊</span>
                    <span>Tổng quan</span>
                </a>
                <a href="manage-products.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                    <span class="text-xl">📦</span>
                    <span>Sản phẩm</span>
                </a>
                <a href="orders.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg bg-primary text-white mb-2">
                    <span class="text-xl">🛒</span>
                    <span>Đơn hàng</span>
                </a>
                <a href="manage-categories.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                    <span class="text-xl">🏷️</span>
                    <span>Danh mục</span>
                </a>
                <a href="manage-news.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                    <span class="text-xl">📰</span>
                    <span>Tin tức</span>
                </a>
                <a href="manage-flash-sale.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                    <span class="text-xl">⚡</span>
                    <span>Flash Sale</span>
                </a>
                <a href="customers.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                    <span class="text-xl">👥</span>
                    <span>Khách hàng</span>
                </a>
                <a href="settings.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                    <span class="text-xl">⚙️</span>
                    <span>Cài đặt</span>
                </a>
            </div>
                
            <div class="border-t border-gray-700 pt-4 mt-4">
                    <a href="../index.html" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 mb-2">
                        <span class="text-xl">🏠</span>
                        <span>Về trang chủ</span>
                    </a>
                    <button onclick="logout()" class="flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-gray-700 w-full text-left">
                        <span class="text-xl">🚪</span>
                        <span>Đăng xuất</span>
                    </button>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col ml-64">
            <!-- Top Bar -->
            <header class="bg-white shadow-sm">
                <div class="flex items-center justify-between px-6 py-4">
                    <h2 class="text-2xl font-bold text-gray-800">Quản lý Đơn hàng</h2>
                    <div class="flex items-center space-x-4">
                        <span class="text-gray-600">Xin chào, <strong id="admin-name"></strong></span>
                        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white font-bold">
                            A
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <main class="flex-1 overflow-y-auto p-6">
                <div class="mb-6">
                    <p class="text-gray-600">Xem và cập nhật trạng thái đơn hàng</p>
                </div>

                <!-- Filter -->
                <div class="mb-6 flex gap-4">
                    <select id="status-filter" class="px-4 py-2 border rounded-lg">
                        <option value="">Tất cả trạng thái</option>
                        <option value="1">Chờ xử lý</option>
                        <option value="2">Đã xác nhận</option>
                        <option value="3">Đang giao hàng</option>
                        <option value="4">Đã hoàn thành</option>
                        <option value="5">Đã hủy</option>
                    </select>
                </div>

                <!-- Orders Table -->
                <div class="bg-white rounded-xl shadow-md overflow-hidden">
                    <div id="orders-table" class="overflow-x-auto">
                        <p class="p-6 text-gray-500">Đang tải...</p>
                    </div>
                </div>
            </main>
        </div>

    <!-- Update Status Modal -->
    <div id="status-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-bold mb-6">Cập nhật trạng thái</h3>
            <form id="status-form">
                <input type="hidden" id="order-id">
                
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-2">Trạng thái mới</label>
                    <select id="trang_thai_don_hang_id" required class="w-full px-4 py-2 border rounded-lg">
                        <option value="1">Chờ xử lý</option>
                        <option value="2">Đã xác nhận</option>
                        <option value="3">Đang giao hàng</option>
                        <option value="4">Đã hoàn thành</option>
                        <option value="5">Đã hủy</option>
                    </select>
                </div>

                <div class="flex gap-4">
                    <button type="submit" class="flex-1 bg-primary hover:bg-cyan-600 text-white py-2 rounded-lg font-semibold">
                        Cập nhật
                    </button>
                    <button type="button" onclick="closeStatusModal()" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-800 py-2 rounded-lg font-semibold">
                        Hủy
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="admin-auth.js"></script>
    <script>
        function logout() {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '../login.html';
            }
        }
    </script>
    <script>
        let allOrders = [];

        async function loadOrders() {
            try {
                const data = await apiCall('/orders/admin/all', 'GET', null, true);
                allOrders = data.data;
                displayOrders(allOrders);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('orders-table').innerHTML = 
                    '<p class="p-6 text-red-500">Lỗi tải dữ liệu: ' + error.message + '</p>';
            }
        }

        function displayOrders(orders) {
            const table = document.getElementById('orders-table');
            
            if (orders.length === 0) {
                table.innerHTML = '<p class="p-6 text-gray-500">Không có đơn hàng nào</p>';
                return;
            }

            table.innerHTML = `
                <table class="min-w-full">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Mã ĐH</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Khách hàng</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">SĐT</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Tổng tiền</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Trạng thái</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Ngày đặt</th>
                            <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        ${orders.map(order => `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 font-semibold">#${order.don_hang_id}</td>
                                <td class="px-6 py-4">${order.ten_nguoi_nhan}</td>
                                <td class="px-6 py-4">${order.sdt_nguoi_nhan}</td>
                                <td class="px-6 py-4 font-semibold">${formatCurrency(order.tong_tien)}</td>
                                <td class="px-6 py-4">
                                    <span class="px-3 py-1 rounded-full text-sm font-semibold" style="background-color: ${order.ma_mau_sac}20; color: ${order.ma_mau_sac}">
                                        ${order.ten_trang_thai}
                                    </span>
                                </td>
                                <td class="px-6 py-4 text-gray-600">${formatDate(order.ngay_dat_hang)}</td>
                                <td class="px-6 py-4">
                                    <button onclick="updateStatus(${order.don_hang_id}, ${order.trang_thai_don_hang_id})" class="text-blue-600 hover:text-blue-800 mr-3">
                                        ✏️ Cập nhật
                                    </button>
                                    <a href="../order-detail.html?id=${order.don_hang_id}" class="text-primary hover:text-cyan-700">
                                        👁️ Xem
                                    </a>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function updateStatus(orderId, currentStatus) {
            document.getElementById('order-id').value = orderId;
            document.getElementById('trang_thai_don_hang_id').value = currentStatus;
            document.getElementById('status-modal').classList.remove('hidden');
        }

        function closeStatusModal() {
            document.getElementById('status-modal').classList.add('hidden');
        }

        // Filter orders
        document.getElementById('status-filter').addEventListener('change', (e) => {
            const statusId = e.target.value;
            if (statusId) {
                const filtered = allOrders.filter(o => o.trang_thai_don_hang_id == statusId);
                displayOrders(filtered);
            } else {
                displayOrders(allOrders);
            }
        });

        // Handle status update
        document.getElementById('status-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const orderId = document.getElementById('order-id').value;
            const statusId = document.getElementById('trang_thai_don_hang_id').value;

            try {
                await apiCall(`/orders/${orderId}/status`, 'PUT', { trang_thai_don_hang_id: parseInt(statusId) }, true);
                
                alert('Cập nhật trạng thái thành công!');
                closeStatusModal();
                loadOrders();
            } catch (error) {
                alert('Lỗi: ' + error.message);
            }
        });

        // Auto refresh every 30 seconds
        let autoRefreshInterval;
        
        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                loadOrders();
                console.log('🔄 Đã cập nhật danh sách đơn hàng');
            }, 30000); // 30 giây
        }

        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        }

        // Load initial data and start auto refresh
        loadOrders().then(() => {
            startAutoRefresh();
            console.log('✅ Tự động cập nhật đơn hàng mỗi 30 giây');
        });

        // Stop auto refresh when page is hidden
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutoRefresh();
            } else {
                startAutoRefresh();
            }
        });
    </script>
</body>
</html>
