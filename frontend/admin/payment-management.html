<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thanh toán - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#06B6D4' } } }
        }
    </script>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-64 bg-white shadow-md">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-800">Admin Panel</h2>
            </div>
            <nav class="mt-6">
                <a href="dashboard.html" class="block px-6 py-3 text-gray-700 hover:bg-gray-100">Dashboard</a>
                <a href="orders.html" class="block px-6 py-3 text-gray-700 hover:bg-gray-100">Đơn hàng</a>
                <a href="payment-management.html" class="block px-6 py-3 bg-primary text-white">Thanh toán</a>
                <a href="manage-products.html" class="block px-6 py-3 text-gray-700 hover:bg-gray-100">Sản phẩm</a>
                <a href="customers.html" class="block px-6 py-3 text-gray-700 hover:bg-gray-100">Khách hàng</a>
                <a href="contact-messages.html" class="block px-6 py-3 text-gray-700 hover:bg-gray-100">Liên hệ</a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <div class="p-8">
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-800">Quản lý thanh toán</h1>
                </div>

                <!-- Payment Statistics -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-2 bg-yellow-100 rounded-lg">
                                <svg class="w-6 h-6 text-yellow-600" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">Chờ xác nhận</p>
                                <p id="pending-count" class="text-2xl font-bold text-gray-900">0</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-2 bg-green-100 rounded-lg">
                                <svg class="w-6 h-6 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                                </svg>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">Đã thanh toán</p>
                                <p id="completed-count" class="text-2xl font-bold text-gray-900">0</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-2 bg-red-100 rounded-lg">
                                <svg class="w-6 h-6 text-red-600" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                                </svg>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">Thất bại</p>
                                <p id="failed-count" class="text-2xl font-bold text-gray-900">0</p>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-lg shadow p-6">
                        <div class="flex items-center">
                            <div class="p-2 bg-blue-100 rounded-lg">
                                <svg class="w-6 h-6 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                    <path d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2V6h10a2 2 0 00-2-2H4zm2 6a2 2 0 012-2h8a2 2 0 012 2v4a2 2 0 01-2 2H8a2 2 0 01-2-2v-4zm6 4a2 2 0 100-4 2 2 0 000 4z"/>
                                </svg>
                            </div>
                            <div class="ml-4">
                                <p class="text-sm font-medium text-gray-600">Tổng tiền</p>
                                <p id="total-amount" class="text-2xl font-bold text-gray-900">0đ</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Payment List -->
                <div class="bg-white rounded-lg shadow">
                    <div class="p-6 border-b border-gray-200">
                        <h2 class="text-xl font-semibold text-gray-800">Danh sách thanh toán</h2>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Đơn hàng</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Khách hàng</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Số tiền</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ngân hàng</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Trạng thái</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ngày tạo</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="payments-table" class="bg-white divide-y divide-gray-200">
                                <!-- Payment rows will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Payment Modal -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-md mx-4">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Xác nhận thanh toán</h3>
            <form id="confirm-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Mã giao dịch</label>
                    <input type="text" id="transaction-id" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ghi chú</label>
                    <textarea id="note" rows="3"
                              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeConfirmModal()"
                            class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300">
                        Hủy
                    </button>
                    <button type="submit"
                            class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                        Xác nhận
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="admin-auth.js"></script>
    <script>
        let currentOrderId = null;

        // Load payment statistics and list
        async function loadPayments() {
            try {
                // Load real payment data from API
                const response = await apiCall('/payment/list', 'GET', null, true);
                
                // If API not implemented yet, use sample data for demo
                const samplePayments = [
                    {
                        don_hang_id: 1,
                        khach_hang: 'Hứa Thảo Vy',
                        so_tien: 2500000,
                        bank_code: 'MB',
                        trang_thai: 'pending',
                        ngay_tao: '2025-01-11 10:30:00'
                    },
                    {
                        don_hang_id: 2,
                        khach_hang: 'Nguyễn Văn Test',
                        so_tien: 1800000,
                        bank_code: 'VCB',
                        trang_thai: 'completed',
                        ngay_tao: '2025-01-11 09:15:00'
                    },
                    {
                        don_hang_id: 3,
                        khach_hang: 'Demo User',
                        so_tien: 3200000,
                        bank_code: 'TCB',
                        trang_thai: 'completed',
                        ngay_tao: '2025-01-11 08:45:00',
                        ma_giao_dich: 'DEMO1736589123456'
                    }
                ];

                displayPayments(samplePayments);
                updateStatistics(samplePayments);

            } catch (error) {
                console.error('Error loading payments:', error);
                
                // Fallback to sample data
                const samplePayments = [
                    {
                        don_hang_id: 1,
                        khach_hang: 'Demo Customer',
                        so_tien: 2500000,
                        bank_code: 'MB',
                        trang_thai: 'pending',
                        ngay_tao: '2025-01-11 10:30:00'
                    }
                ];
                displayPayments(samplePayments);
                updateStatistics(samplePayments);
            }
        }

        function displayPayments(payments) {
            const tbody = document.getElementById('payments-table');
            tbody.innerHTML = payments.map(payment => `
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        #${payment.don_hang_id}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${payment.khach_hang}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${formatCurrency(payment.so_tien)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${payment.bank_code}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${getStatusBadge(payment.trang_thai)}">
                            ${getStatusText(payment.trang_thai)}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${formatDate(payment.ngay_tao)}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        ${payment.trang_thai === 'pending' ? `
                            <button onclick="confirmPayment(${payment.don_hang_id})"
                                    class="text-green-600 hover:text-green-900 mr-3">
                                Xác nhận
                            </button>
                        ` : ''}
                        <a href="orders.html?id=${payment.don_hang_id}" class="text-primary hover:text-primary/80">
                            Xem đơn hàng
                        </a>
                    </td>
                </tr>
            `).join('');
        }

        function updateStatistics(payments) {
            const pending = payments.filter(p => p.trang_thai === 'pending').length;
            const completed = payments.filter(p => p.trang_thai === 'completed').length;
            const failed = payments.filter(p => p.trang_thai === 'failed').length;
            const total = payments.reduce((sum, p) => sum + p.so_tien, 0);

            document.getElementById('pending-count').textContent = pending;
            document.getElementById('completed-count').textContent = completed;
            document.getElementById('failed-count').textContent = failed;
            document.getElementById('total-amount').textContent = formatCurrency(total);
        }

        function getStatusBadge(status) {
            const badges = {
                'pending': 'bg-yellow-100 text-yellow-800',
                'completed': 'bg-green-100 text-green-800',
                'failed': 'bg-red-100 text-red-800',
                'expired': 'bg-gray-100 text-gray-800'
            };
            return badges[status] || badges['pending'];
        }

        function getStatusText(status) {
            const texts = {
                'pending': 'Chờ xác nhận',
                'completed': 'Đã thanh toán',
                'failed': 'Thất bại',
                'expired': 'Hết hạn'
            };
            return texts[status] || 'Không xác định';
        }

        function confirmPayment(orderId) {
            currentOrderId = orderId;
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function closeConfirmModal() {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('confirm-form').reset();
            currentOrderId = null;
        }

        // Handle confirm payment form
        document.getElementById('confirm-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const transactionId = document.getElementById('transaction-id').value;
            const note = document.getElementById('note').value;

            try {
                await apiCall(`/payment/confirm/${currentOrderId}`, 'POST', {
                    transaction_id: transactionId,
                    note: note
                }, true);

                alert('Xác nhận thanh toán thành công!');
                closeConfirmModal();
                loadPayments(); // Reload the list

            } catch (error) {
                alert('Có lỗi xảy ra: ' + error.message);
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadPayments();
        });
    </script>
</body>
</html>
