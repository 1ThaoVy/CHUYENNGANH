<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - Orianna Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#06B6D4' } } }
        }
    </script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <a href="index.html" class="flex items-center space-x-2">
                    <img src="http://localhost:3001/images/logo.png?v=2" alt="Logo" class="h-10 w-10 rounded-full">
                    <span class="text-xl font-bold text-gray-800">Orianna Shop</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 py-8 flex-grow">
        <div class="flex items-center mb-8">
            <button onclick="history.back()" 
                    class="flex items-center text-gray-600 hover:text-primary mr-4 p-2 rounded-lg hover:bg-gray-100 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="text-3xl font-bold">Thanh toán</h1>
        </div>

        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2">
                <form id="checkout-form" class="bg-white rounded-lg shadow-md p-6 space-y-4">
                    <h2 class="text-xl font-bold mb-4">Thông tin giao hàng</h2>

                    <!-- Thông tin tài khoản mặc định -->
                    <div id="default-info" class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4">
                        <h3 class="font-semibold text-blue-800 mb-2">Thông tin tài khoản</h3>
                        <div id="user-info" class="text-sm text-blue-700 space-y-1">
                            <!-- Thông tin sẽ được load từ JavaScript -->
                        </div>
                    </div>

                    <!-- Checkbox để chọn địa chỉ giao hàng khác -->
                    <div class="flex items-center mb-4">
                        <input type="checkbox" id="use-different-address" 
                               class="mr-3 text-primary focus:ring-primary">
                        <label for="use-different-address" class="text-sm font-medium">
                            Giao hàng đến địa chỉ khác
                        </label>
                    </div>

                    <!-- Form thông tin giao hàng (ẩn mặc định) -->
                    <div id="shipping-form" class="hidden space-y-4 border-t pt-4">
                        <h3 class="font-semibold text-gray-800">Thông tin người nhận</h3>
                        
                        <div>
                            <label class="block text-sm font-semibold mb-2">Tên người nhận *</label>
                            <input type="text" id="ten_nguoi_nhan_khac" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">Số điện thoại *</label>
                            <input type="tel" id="sdt_nguoi_nhan_khac" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2">Địa chỉ giao hàng *</label>
                            <textarea id="dia_chi_giao_hang_khac" rows="3" 
                                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                        </div>
                    </div>

                    <!-- Hidden inputs để lưu thông tin thực tế sẽ gửi -->
                    <input type="hidden" id="ten_nguoi_nhan">
                    <input type="hidden" id="sdt_nguoi_nhan">
                    <input type="hidden" id="dia_chi_giao_hang">

                    <div>
                        <label class="block text-sm font-semibold mb-2">Phương thức thanh toán</label>
                        <div class="space-y-3">
                            <label class="flex items-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
                                <input type="radio" name="phuong_thuc_thanh_toan" value="COD" checked
                                       class="mr-3 text-primary focus:ring-primary">
                                <div class="flex items-center">
                                    <svg class="w-6 h-6 mr-2 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4zM18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z"/>
                                    </svg>
                                    <div>
                                        <div class="font-semibold">Thanh toán khi nhận hàng (COD)</div>
                                        <div class="text-sm text-gray-500">Thanh toán bằng tiền mặt khi nhận hàng</div>
                                    </div>
                                </div>
                            </label>
                            
                            <label class="flex items-center p-3 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-50">
                                <input type="radio" name="phuong_thuc_thanh_toan" value="QR_Banking"
                                       class="mr-3 text-primary focus:ring-primary">
                                <div class="flex items-center">
                                    <svg class="w-6 h-6 mr-2 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                        <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                                    </svg>
                                    <div>
                                        <div class="font-semibold">Thanh toán QR Banking</div>
                                        <div class="text-sm text-gray-500">Quét mã QR để chuyển khoản ngân hàng</div>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <button type="submit" 
                            class="w-full bg-primary hover:bg-purple-700 text-white font-semibold py-2 px-6 rounded-lg transition">
                        Đặt hàng
                    </button>
                </form>
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold mb-4">Đơn hàng của bạn</h2>
                    
                    <div id="order-items" class="space-y-3 mb-4"></div>

                    <div class="border-t pt-4 space-y-2">
                        <div class="flex justify-between">
                            <span>Tạm tính:</span>
                            <span id="subtotal">0đ</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Phí vận chuyển:</span>
                            <span>Miễn phí</span>
                        </div>
                        <div class="flex justify-between text-xl font-bold pt-2 border-t">
                            <span>Tổng cộng:</span>
                            <span id="total" class="text-primary">0đ</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-auto">
        <div class="container mx-auto px-4 py-6 text-center text-gray-400">
            <p>&copy; 2025 Orianna Shop. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Check if cart is empty
        const cart = getCart();
        if (cart.length === 0) {
            window.location.href = 'cart.html';
        }

        // Check auth
        const token = localStorage.getItem('token');
        if (!token) {
            alert('Vui lòng đăng nhập để đặt hàng');
            window.location.href = 'login.html';
        }

        // Load user info and display default info
        const user = JSON.parse(localStorage.getItem('user') || '{}');
        
        function displayUserInfo() {
            const userInfoDiv = document.getElementById('user-info');
            if (user) {
                userInfoDiv.innerHTML = `
                    <div><strong>Tên:</strong> ${user.ho_ten || 'Chưa cập nhật'}</div>
                    <div><strong>Số điện thoại:</strong> ${user.so_dien_thoai || 'Chưa cập nhật'}</div>
                    <div><strong>Địa chỉ:</strong> ${user.dia_chi || 'Chưa cập nhật'}</div>
                `;
                
                // Set default values to hidden inputs
                document.getElementById('ten_nguoi_nhan').value = user.ho_ten || '';
                document.getElementById('sdt_nguoi_nhan').value = user.so_dien_thoai || '';
                document.getElementById('dia_chi_giao_hang').value = user.dia_chi || '';
            }
        }

        // Handle different address checkbox
        document.getElementById('use-different-address').addEventListener('change', function() {
            const shippingForm = document.getElementById('shipping-form');
            const isChecked = this.checked;
            
            if (isChecked) {
                shippingForm.classList.remove('hidden');
                // Clear and focus on first input
                document.getElementById('ten_nguoi_nhan_khac').value = '';
                document.getElementById('sdt_nguoi_nhan_khac').value = '';
                document.getElementById('dia_chi_giao_hang_khac').value = '';
                document.getElementById('ten_nguoi_nhan_khac').focus();
            } else {
                shippingForm.classList.add('hidden');
                // Reset to user default info
                document.getElementById('ten_nguoi_nhan').value = user.ho_ten || '';
                document.getElementById('sdt_nguoi_nhan').value = user.so_dien_thoai || '';
                document.getElementById('dia_chi_giao_hang').value = user.dia_chi || '';
            }
        });

        // Update hidden inputs when different address form changes
        function updateShippingInfo() {
            const useDifferentAddress = document.getElementById('use-different-address').checked;
            
            if (useDifferentAddress) {
                document.getElementById('ten_nguoi_nhan').value = document.getElementById('ten_nguoi_nhan_khac').value;
                document.getElementById('sdt_nguoi_nhan').value = document.getElementById('sdt_nguoi_nhan_khac').value;
                document.getElementById('dia_chi_giao_hang').value = document.getElementById('dia_chi_giao_hang_khac').value;
            } else {
                document.getElementById('ten_nguoi_nhan').value = user.ho_ten || '';
                document.getElementById('sdt_nguoi_nhan').value = user.so_dien_thoai || '';
                document.getElementById('dia_chi_giao_hang').value = user.dia_chi || '';
            }
        }

        // Add event listeners to different address inputs
        document.getElementById('ten_nguoi_nhan_khac').addEventListener('input', updateShippingInfo);
        document.getElementById('sdt_nguoi_nhan_khac').addEventListener('input', updateShippingInfo);
        document.getElementById('dia_chi_giao_hang_khac').addEventListener('input', updateShippingInfo);

        // Display order summary
        function displayOrderSummary() {
            const orderItems = document.getElementById('order-items');
            orderItems.innerHTML = cart.map(item => `
                <div class="flex justify-between text-sm">
                    <span class="flex-1">${item.ten_san_pham} x${item.quantity}</span>
                    <span class="font-semibold">${formatCurrency(parseFloat(item.gia_ban) * item.quantity)}</span>
                </div>
            `).join('');

            const total = getCartTotal();
            document.getElementById('subtotal').textContent = formatCurrency(total);
            document.getElementById('total').textContent = formatCurrency(total);
        }

        // Handle checkout
        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorDiv = document.getElementById('error');
            errorDiv.classList.add('hidden');

            // Update shipping info before validation
            updateShippingInfo();

            // Validate required fields
            const tenNguoiNhan = document.getElementById('ten_nguoi_nhan').value.trim();
            const sdtNguoiNhan = document.getElementById('sdt_nguoi_nhan').value.trim();
            const diaChiGiaoHang = document.getElementById('dia_chi_giao_hang').value.trim();

            if (!tenNguoiNhan || !sdtNguoiNhan || !diaChiGiaoHang) {
                errorDiv.textContent = 'Vui lòng điền đầy đủ thông tin giao hàng';
                errorDiv.classList.remove('hidden');
                return;
            }

            const paymentMethod = document.querySelector('input[name="phuong_thuc_thanh_toan"]:checked').value;

            const orderData = {
                ten_nguoi_nhan: tenNguoiNhan,
                sdt_nguoi_nhan: sdtNguoiNhan,
                dia_chi_giao_hang: diaChiGiaoHang,
                phuong_thuc_thanh_toan: paymentMethod,
                items: cart.map(item => ({
                    san_pham_id: item.san_pham_id,
                    so_luong: item.quantity
                }))
            };

            try {
                const data = await apiCall('/orders', 'POST', orderData, true);

                if (paymentMethod === 'QR_Banking') {
                    // Chuyển đến trang thanh toán QR
                    clearCart();
                    window.location.href = `payment-qr.html?order_id=${data.data.don_hang_id}`;
                } else {
                    // COD - chuyển đến trang chi tiết đơn hàng
                    clearCart();
                    alert('Đặt hàng thành công!');
                    window.location.href = `order-detail.html?id=${data.data.don_hang_id}`;
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            }
        });

        // Initialize
        displayUserInfo();
        displayOrderSummary();
    </script>
</body>
</html>
